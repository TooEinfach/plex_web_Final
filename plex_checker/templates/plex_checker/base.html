<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plex Checker{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'plex_checker/css/style.css' %}">
</head>
<body>
    <!-- Animated gradient background -->
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <div class="container">
            <div class="logo">Plex Checker</div>
            <div class="nav-links">
                <a href="{% url 'plex_checker:index' %}" class="nav-link">Search</a>
                <a href="{% url 'plex_checker:todo_list' %}" class="nav-link">To-Do</a>
                <a href="{% url 'plex_checker:stats' %}" class="nav-link">Stats</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Plex Checker © 2026 • Connected to: {{ PLEX_BASE|default:"Not configured" }}</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
